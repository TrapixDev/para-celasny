<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Celasny ❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', 'Poppins', Arial, sans-serif;
    background: linear-gradient(135deg, #2b0a2e 0%, #4a0e3f 35%, #7a1f4d 70%, #b03a5b 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    position: relative;
    overflow-x: hidden;
  }

  .hearts-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  .heart-float {
    position: absolute;
    font-size: 20px;
    color: rgba(255, 150, 180, 0.5);
    animation: floatUp linear infinite;
    user-select: none;
  }

  @keyframes floatUp {
    0%   { transform: translateY(110vh) scale(0.8); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(-15vh) scale(1.3); opacity: 0; }
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 28px;
    padding: 40px 30px 45px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
  }

  .title {
    font-size: 2.4rem;
    font-weight: 800;
    color: #ffd9e4;
    text-shadow: 0 0 25px rgba(255, 105, 150, 0.9), 0 4px 10px rgba(0,0,0,0.4);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .subtitle {
    color: #ffc9d8;
    font-size: 1.05rem;
    margin-bottom: 25px;
    opacity: 0.95;
  }

  .photo-frame {
    width: 240px;
    height: 240px;
    margin: 0 auto 25px;
    border-radius: 50%;
    padding: 6px;
    background: conic-gradient(from 0deg, #ff6b9d, #ff2e63, #ff6b9d, #ff2e63, #ff6b9d);
    animation: spinBorder 6s linear infinite;
    box-shadow: 0 12px 40px rgba(255, 46, 99, 0.45);
  }

  @keyframes spinBorder {
    0%   { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #2b0a2e;
    display: block;
  }

  .message {
    color: #fff;
    font-size: 1.15rem;
    line-height: 1.9;
    margin-bottom: 28px;
  }

  .message .name {
    color: #ffd166;
    font-weight: 700;
    font-size: 1.35rem;
  }

  #counter {
    font-size: 2.8rem;
    font-weight: 900;
    color: #ff2e63;
    text-shadow: 0 0 30px rgba(255, 46, 99, 0.8);
    margin-bottom: 5px;
    font-variant-numeric: tabular-nums;
  }

  .counter-label {
    color: #ffc9d8;
    font-size: 0.95rem;
    margin-bottom: 25px;
  }

  .btn {
    background: linear-gradient(135deg, #ff2e63, #ff6b9d);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 15px 40px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 25px rgba(255, 46, 99, 0.5);
    font-family: inherit;
  }

  .btn:hover {
    transform: scale(1.06);
    box-shadow: 0 12px 35px rgba(255, 46, 99, 0.7);
  }

  .btn:active { transform: scale(0.97); }

  .video-container {
    width: 100%;
    margin: 0 auto 28px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 105, 150, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.15);
  }

  .video-container video {
    width: 100%;
    display: block;
    border-radius: 16px;
  }

  .burst { position: fixed; z-index: 10; pointer-events: none; animation: pop 1.2s ease-out forwards; font-size: 28px; }

  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
    100% { transform: translate(-50%, -180px) scale(1.6); opacity: 0; }
  }

  .footer {
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.85rem;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="card">
  <h1 class="title">Celasny</h1>
  <p class="subtitle">Mi amor, mi vida, mi todo</p>

  <div class="photo-frame">
    <img src="Screenshot_20260323-150354.jpg" alt="Celasny">
  </div>

  <p class="message">
    No hay palabras suficientes para explicar<br>
    lo mucho que te amo, <span class="name">mi Celasny</span>.<br>
    Eres la persona más hermosa, dentro y fuera.<br>
    Cada día a tu lado es el mejor regalo.<br>
    <b>Te amo con todo mi corazón.</b>
  </p>

  <div class="video-container">
    <video controls playsinline poster="Screenshot_20260323-150354.jpg">
      <source src="WhatsApp Video 2026-08-30 at 6.00.21 AM.mp4" type="video/mp4">
    </video>
  </div>

  <div id="counter">0</div>
  <div class="counter-label">motivos por los que te amo</div>

  <button class="btn" id="btnLove">❤ Toca aquí, mi amor</button>

  <p class="footer">Hecho con todo mi amor para ti</p>
</div>

<script>
  const bg = document.getElementById('heartsBg');
  const symbols = ['❤', '💖', '💕', '💗', '🌸', '✨'];

  function spawnHeart() {
    const el = document.createElement('div');
    el.className = 'heart-float';
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (12 + Math.random() * 28) + 'px';
    el.style.animationDuration = (6 + Math.random() * 8) + 's';
    el.style.animationDelay = (-Math.random() * 10) + 's';
    bg.appendChild(el);
  }

  for (let i = 0; i < 18; i++) spawnHeart();

  const counterEl = document.getElementById('counter');
  let count = 0;

  const btn = document.getElementById('btnLove');
  btn.addEventListener('click', () => {
    count += 1 + Math.floor(Math.random() * 4);
    counterEl.textContent = count;

    for (let i = 0; i < 22; i++) {
      const heart = document.createElement('div');
      heart.className = 'burst';
      heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      heart.style.left = (btn.getBoundingClientRect().left + Math.random() * 160) + 'px';
      heart.style.top = (btn.getBoundingClientRect().top - 20) + 'px';
      heart.style.animationDelay = (Math.random() * 0.5) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1800);
    }
  });
</script>

</body>
</html>
